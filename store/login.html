<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | المتجر</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="header">
  <div class="container header__top">
    <button class="icon-btn nav__toggle" data-nav-toggle aria-label="القائمة">☰</button>
    <a href="index.html" class="brand"><span class="brand__mark">🛍️</span><span class="brand__text">المتجر</span></a>
    <div style="flex:1"></div>
    <div class="header__actions">
      <button class="icon-btn" data-theme-toggle title="الوضع الليلي/النهاري">🌙</button>
      <a href="cart.html" class="icon-btn" title="السلة">🛒<span class="badge" data-cart-count>0</span></a>
      <div data-auth-area></div>
    </div>
  </div>
  <nav class="nav">
    <div class="container">
      <ul class="nav__menu" data-nav-menu>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="products.html">كل المنتجات</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>تسجيل الدخول</h1>
    <p class="sub">مرحبًا بعودتك! سجّل الدخول لمتابعة التسوق</p>
    <div id="auth-msg" class="auth-msg"></div>
    <form id="login-form">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" required minlength="6">
      </div>
      <div class="flex justify-between" style="margin-bottom:16px">
        <button type="button" id="forgot-password" class="muted" style="background:none;border:none;font-size:13px;cursor:pointer">نسيت كلمة المرور؟</button>
      </div>
      <button type="submit" class="btn btn--primary btn--block">تسجيل الدخول</button>
    </form>
    <div class="auth-foot">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom">© 2026 المتجر. جميع الحقوق محفوظة.</div>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
