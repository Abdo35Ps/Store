<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة التصنيفات | لوحة التحكم</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar">
    <div class="admin-sidebar__brand"><span class="mark">🛍️</span> إدارة المتجر</div>
    <a href="index.html">📊 لوحة التحكم</a>
    <a href="products.html">📦 المنتجات</a>
    <a href="categories.html" class="active">🗂️ التصنيفات</a>
    <a href="orders.html">🧾 الطلبات</a>
    <a href="users.html">👥 المستخدمون</a>
    <a href="banners.html">🖼️ البانرات والعروض</a>
    <a href="settings.html">⚙️ إعدادات المتجر</a>
    <div class="admin-sidebar__foot"><button class="btn btn--ghost" style="width:100%" id="logout-btn">تسجيل الخروج</button></div>
  </aside>

  <div>
    <header class="admin-topbar">
      <div class="flex items-center gap-12"><button class="admin-topbar__burger" id="burger">☰</button><h1>إدارة التصنيفات</h1></div>
      <div class="admin-topbar__actions"><button class="admin-icon-btn" data-theme-toggle>🌙</button></div>
    </header>
    <main class="admin-main">
      <div class="panel__head" style="margin-bottom:18px">
        <div></div>
        <button class="btn btn--primary" id="add-category-btn">+ إضافة تصنيف</button>
      </div>
      <div class="stat-grid" id="categories-grid" style="grid-template-columns:repeat(4,1fr)"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="category-modal">
  <div class="modal-box" style="max-width:420px">
    <button class="modal-close" id="modal-close">✕</button>
    <h3 id="modal-title">إضافة تصنيف</h3>
    <form id="category-form">
      <div class="field"><label>اسم التصنيف</label><input type="text" id="form-cat-name" required></div>
      <div class="field">
        <label>صورة التصنيف</label>
        <div class="upload-box" id="upload-box-cat">📷 اضغط لاختيار صورة (يحتاج تفعيل Storage)</div>
        <input type="file" id="form-cat-image" accept="image/*" hidden>
        <div class="field" style="margin-top:10px">
          <label>أو الصق رابط صورة (اختياري - يعمل بدون Storage)</label>
          <div class="flex gap-8">
            <input type="url" id="form-cat-image-url" placeholder="https://example.com/image.jpg" style="flex:1">
            <button type="button" class="btn btn--ghost btn--sm" id="add-cat-image-url-btn">إضافة</button>
          </div>
        </div>
        <div class="img-preview-grid" id="cat-image-preview"></div>
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%">حفظ التصنيف</button>
    </form>
  </div>
</div>

<script type="module" src="../store/js/main.js"></script>
<script type="module" src="js/admin-categories.js"></script>
<script type="module">
  import { adminLogout } from "./js/admin-auth.js";
  document.getElementById("logout-btn").addEventListener("click", adminLogout);
  document.getElementById("burger").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
</script>
</body>
</html>
