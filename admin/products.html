<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات | لوحة التحكم</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar">
    <div class="admin-sidebar__brand"><span class="mark">🛍️</span> إدارة المتجر</div>
    <a href="index.html">📊 لوحة التحكم</a>
    <a href="products.html" class="active">📦 المنتجات</a>
    <a href="categories.html">🗂️ التصنيفات</a>
    <a href="orders.html">🧾 الطلبات</a>
    <a href="users.html">👥 المستخدمون</a>
    <a href="banners.html">🖼️ البانرات والعروض</a>
    <a href="settings.html">⚙️ إعدادات المتجر</a>
    <div class="admin-sidebar__foot"><button class="btn btn--ghost" style="width:100%" id="logout-btn">تسجيل الخروج</button></div>
  </aside>

  <div>
    <header class="admin-topbar">
      <div class="flex items-center gap-12"><button class="admin-topbar__burger" id="burger">☰</button><h1>إدارة المنتجات</h1></div>
      <div class="admin-topbar__actions"><button class="admin-icon-btn" data-theme-toggle>🌙</button></div>
    </header>

    <main class="admin-main">
      <div class="panel">
        <div class="panel__head">
          <div class="flex gap-12" style="flex-wrap:wrap">
            <div class="search-input"><span>🔍</span><input type="text" id="search-products" placeholder="ابحث باسم المنتج..."></div>
            <select id="filter-category" class="field" style="padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text)"></select>
          </div>
          <button class="btn btn--primary" id="add-product-btn">+ إضافة منتج</button>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>الصورة</th><th>الاسم</th><th>التصنيف</th><th>السعر</th><th>المخزون</th><th>مميز</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="products-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal: Add/Edit Product -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">✕</button>
    <h3 id="modal-title">إضافة منتج</h3>
    <form id="product-form">
      <div class="field"><label>اسم المنتج</label><input type="text" id="form-name" required></div>
      <div class="field"><label>الوصف</label><textarea id="form-description" rows="3"></textarea></div>
      <div class="field-row">
        <div class="field"><label>السعر</label><input type="number" id="form-price" min="0" step="0.01" required></div>
        <div class="field"><label>السعر قبل الخصم (اختياري)</label><input type="number" id="form-old-price" min="0" step="0.01"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>المخزون</label><input type="number" id="form-stock" min="0" required></div>
        <div class="field"><label>التصنيف</label><select id="form-category" required></select></div>
      </div>
      <div class="field-row">
        <label class="switch"><input type="checkbox" id="form-featured"><span class="switch__track"></span> منتج مميز</label>
        <label class="switch"><input type="checkbox" id="form-available" checked><span class="switch__track"></span> متاح للبيع</label>
      </div>
      <div class="field">
        <label>صور المنتج</label>
        <div class="upload-box" id="upload-box">📷 اضغط لاختيار صور المنتج (يحتاج تفعيل Storage)</div>
        <input type="file" id="form-images" accept="image/*" multiple hidden>
        <div class="field" style="margin-top:10px">
          <label>أو الصق رابط صورة (اختياري - يعمل بدون Storage)</label>
          <div class="flex gap-8">
            <input type="url" id="form-image-url" placeholder="https://example.com/image.jpg" style="flex:1">
            <button type="button" class="btn btn--ghost btn--sm" id="add-image-url-btn">إضافة</button>
          </div>
        </div>
        <div class="img-preview-grid" id="image-preview-grid"></div>
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%">حفظ المنتج</button>
    </form>
  </div>
</div>

<script type="module" src="../store/js/main.js"></script>
<script type="module" src="js/admin-products.js"></script>
<script type="module">
  import { adminLogout } from "./js/admin-auth.js";
  document.getElementById("logout-btn").addEventListener("click", adminLogout);
  document.getElementById("burger").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
</script>
</body>
</html>
