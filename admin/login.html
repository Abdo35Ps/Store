<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الأدمن | لوحة التحكم</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <h1>🔐 لوحة تحكم المتجر</h1>
    <p>سجّل الدخول للوصول إلى لوحة الإدارة</p>
    <div id="auth-msg" class="auth-msg"></div>
    <form id="admin-login-form">
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="login-email" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="login-password" required minlength="6"></div>
      <button type="submit" class="btn btn--primary" style="width:100%">تسجيل الدخول</button>
    </form>
  </div>
</main>
<script type="module" src="js/admin-auth.js"></script>
</body>
</html>
