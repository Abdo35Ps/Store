<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل المنتجات | المتجر</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="header">
  <div class="container header__top">
    <button class="icon-btn nav__toggle" data-nav-toggle aria-label="القائمة">☰</button>
    <a href="index.html" class="brand"><span class="brand__mark">🛍️</span><span class="brand__text">المتجر</span></a>
    <div class="search-bar">
      <input type="text" id="global-search" placeholder="ابحث عن منتج...">
      <button id="global-search-btn" aria-label="بحث">🔍</button>
    </div>
    <div class="header__actions">
      <button class="icon-btn" data-theme-toggle title="الوضع الليلي/النهاري">🌙</button>
      <a href="cart.html" class="icon-btn" title="السلة">🛒<span class="badge" data-cart-count>0</span></a>
      <div data-auth-area></div>
    </div>
  </div>
  <nav class="nav">
    <div class="container">
      <ul class="nav__menu" data-nav-menu>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="products.html" class="active">كل المنتجات</a></li>
      </ul>
    </div>
  </nav>
</header>

<main>
  <div class="container section">
    <div class="section__head">
      <h2 id="page-title">كل المنتجات</h2>
      <select id="sort-select" class="chip" style="padding:9px 14px">
        <option value="">الأحدث</option>
        <option value="price-asc">السعر: من الأقل للأعلى</option>
        <option value="price-desc">السعر: من الأعلى للأقل</option>
        <option value="discount">الأكثر خصمًا</option>
      </select>
    </div>

    <div class="chips" id="category-chips" style="margin-bottom:20px"></div>

    <div class="grid" id="products-grid" style="grid-template-columns:repeat(4,1fr)"></div>
    <div class="flex justify-between items-center gap-8" style="margin-top:28px;justify-content:center" id="pagination"></div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom">© 2026 المتجر. جميع الحقوق محفوظة.</div>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
<script type="module">
  import { fetchProducts, fetchCategories, renderProductsGrid, filterProducts, paginate, renderPagination, skeletonCards, errorState } from "./js/products.js";

  const grid = document.getElementById("products-grid");
  const pagEl = document.getElementById("pagination");
  const chipsEl = document.getElementById("category-chips");
  const sortSelect = document.getElementById("sort-select");
  const params = new URLSearchParams(location.search);

  let allProducts = [], categories = [];
  let state = {
    search: params.get("q") || "",
    category: params.get("cat") || "",
    sort: params.get("sort") || "",
    page: 1
  };
  sortSelect.value = state.sort;
  document.getElementById("global-search").value = state.search;

  skeletonCards(grid, 8);

  async function load() {
    try {
      [allProducts, categories] = await Promise.all([fetchProducts(), fetchCategories()]);
      if (params.get("featured")) allProducts = allProducts.filter(p => p.featured);
      if (params.get("discount")) allProducts = allProducts.filter(p => p.oldPrice && p.oldPrice > p.price);
      renderChips();
      update();
    } catch (e) {
      console.error(e);
      errorState(grid, "تعذر تحميل المنتجات، تأكد من الاتصال بالإنترنت");
    }
  }

  function renderChips() {
    chipsEl.innerHTML = `<button class="chip ${!state.category ? "active" : ""}" data-cat="">الكل</button>` +
      categories.map(c => `<button class="chip ${state.category === c.id ? "active" : ""}" data-cat="${c.id}">${c.name}</button>`).join("");
    chipsEl.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
      state.category = btn.dataset.cat; state.page = 1; renderChips(); update();
    }));
  }

  function update() {
    const filtered = filterProducts(allProducts, state);
    const perPage = 12;
    const pageItems = paginate(filtered, state.page, perPage);
    renderProductsGrid(grid, pageItems);
    renderPagination(pagEl, filtered.length, perPage, state.page, (p) => { state.page = p; update(); window.scrollTo({top:0,behavior:"smooth"}); });
    document.getElementById("page-title").textContent = state.search ? `نتائج البحث عن "${state.search}"` : "كل المنتجات";
  }

  sortSelect.addEventListener("change", () => { state.sort = sortSelect.value; state.page = 1; update(); });

  function goSearch() {
    state.search = document.getElementById("global-search").value.trim();
    state.page = 1; update();
  }
  document.getElementById("global-search-btn").addEventListener("click", goSearch);
  document.getElementById("global-search").addEventListener("keydown", (e) => { if (e.key === "Enter") goSearch(); });

  load();
</script>
</body>
</html>
