<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | المتجر</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="header">
  <div class="container header__top">
    <button class="icon-btn nav__toggle" data-nav-toggle aria-label="القائمة">☰</button>
    <a href="index.html" class="brand"><span class="brand__mark">🛍️</span><span class="brand__text">المتجر</span></a>
    <div style="flex:1"></div>
    <div class="header__actions">
      <button class="icon-btn" data-theme-toggle title="الوضع الليلي/النهاري">🌙</button>
      <a href="cart.html" class="icon-btn" title="السلة">🛒<span class="badge" data-cart-count>0</span></a>
      <div data-auth-area></div>
    </div>
  </div>
  <nav class="nav">
    <div class="container">
      <ul class="nav__menu" data-nav-menu>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="products.html">كل المنتجات</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>إنشاء حساب جديد</h1>
    <p class="sub">انضم إلينا واستمتع بتجربة تسوق مميزة</p>
    <div id="auth-msg" class="auth-msg"></div>
    <form id="register-form">
      <div class="field">
        <label>الاسم الكامل</label>
        <input type="text" id="reg-name" required>
      </div>
      <div class="field">
        <label>رقم الهاتف</label>
        <input type="tel" id="reg-phone" required pattern="[0-9]{10,15}">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="reg-email" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="reg-password" required minlength="6">
      </div>
      <button type="submit" class="btn btn--primary btn--block">إنشاء حساب</button>
    </form>
    <div class="auth-foot">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom">© 2026 المتجر. جميع الحقوق محفوظة.</div>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
