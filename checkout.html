<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | المتجر</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/cart.css">
</head>
<body>

<header class="header">
  <div class="container header__top">
    <a href="index.html" class="brand"><span class="brand__mark">🛍️</span><span class="brand__text">المتجر</span></a>
    <div style="flex:1"></div>
    <div class="header__actions">
      <button class="icon-btn" data-theme-toggle>🌙</button>
      <div data-auth-area></div>
    </div>
  </div>
</header>

<main>
  <div class="container section">
    <div class="stepper">
      <div class="stepper__item active"><span class="stepper__num">1</span> السلة</div>
      <div class="stepper__line"></div>
      <div class="stepper__item active"><span class="stepper__num">2</span> بيانات الشحن</div>
      <div class="stepper__line"></div>
      <div class="stepper__item"><span class="stepper__num">3</span> تأكيد الطلب</div>
    </div>

    <div class="checkout-layout">
      <form id="checkout-form" class="account-panel">
        <h3 style="margin-top:0">بيانات الشحن</h3>
        <div class="field-row">
          <div class="field"><label>الاسم الكامل</label><input type="text" id="co-name" required></div>
          <div class="field"><label>رقم الهاتف</label><input type="tel" id="co-phone" required pattern="[0-9]{10,15}"></div>
        </div>
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="co-email" required></div>
        <div class="field-row">
          <div class="field"><label>المحافظة</label><input type="text" id="co-gov" required></div>
          <div class="field"><label>المدينة</label><input type="text" id="co-city" required></div>
        </div>
        <div class="field"><label>العنوان بالتفصيل</label><textarea id="co-address" rows="3" required></textarea></div>
        <div class="field"><label>ملاحظات على الطلب (اختياري)</label><textarea id="co-notes" rows="2"></textarea></div>

        <h3>طريقة الدفع</h3>
        <div class="pay-methods">
          <label class="pay-method active"><input type="radio" name="payment" value="cash" checked> 💵 الدفع عند الاستلام</label>
          <label class="pay-method"><input type="radio" name="payment" value="wallet"> 📱 محفظة إلكترونية</label>
          <label class="pay-method"><input type="radio" name="payment" value="card"> 💳 بطاقة ائتمان (قريبًا)</label>
        </div>

        <h3>مراجعة الطلب</h3>
        <div id="checkout-review" style="margin-bottom:16px"></div>

        <button type="submit" class="btn btn--primary btn--block">تأكيد الطلب</button>
      </form>

      <div class="summary-box">
        <h3>ملخص الفاتورة</h3>
        <div id="checkout-totals"></div>
      </div>
    </div>
  </div>
</main>

<footer class="footer"><div class="container"><div class="footer__bottom">© 2026 المتجر. جميع الحقوق محفوظة.</div></div></footer>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/checkout.js"></script>
<script>
  document.querySelectorAll(".pay-method").forEach(el => el.addEventListener("click", () => {
    document.querySelectorAll(".pay-method").forEach(x => x.classList.remove("active"));
    el.classList.add("active");
  }));
</script>
</body>
</html>
